name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # Packaging (pyproject.toml): build the sdist and wheel, check the `tiktok-dl` command
      # works when installed with pipx, then run the tests against the installed wheel.
      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Check the pipx-installed command
        shell: bash
        run: |
          installed="$(pipx run --python "$(python -c 'import sys; print(sys.executable)')" --spec dist/*.whl tiktok-dl --version)"
          expected="$(python tiktok-dl.py --version)"
          echo "installed: $installed / expected: $expected"
          test "$installed" = "$expected"

      - name: Install package
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Test installed package
        env:
          TIKTOK_DL_TEST_INSTALLED: "1"
        # The `pytest` command (not `python -m pytest`), so the clone is not on sys.path.
        run: pytest
